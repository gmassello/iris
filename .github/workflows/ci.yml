name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng

      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      # --locked falla si uv.lock quedo desactualizado respecto de pyproject.toml. Es la
      # garantia de que lo que corre en CI es exactamente lo que se resolvio localmente.
      - run: uv sync --locked --group dev

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check src/ bench/
      - run: uv run pytest -q

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  compose:
    name: Smoke test del Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # El README promete "clone + docker compose up". Si eso no se verifica, se rompe en
      # silencio y el primero en descubrirlo es quien clona el repo.
      - name: Levantar el stack
        run: docker compose up -d --build api

      - name: Esperar a que la API este sana
        run: |
          for i in $(seq 1 30); do
            if curl -sf localhost:8000/health > /dev/null; then
              echo "API arriba"; exit 0
            fi
            sleep 5
          done
          echo "la API nunca respondio"; docker compose logs api; exit 1

      - name: Extraer un recibo real y validar el JSON
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          img = Image.new("RGB", (700, 400), "white")
          draw = ImageDraw.Draw(img)
          for i, line in enumerate(["ALMACEN CENTRAL", "Cafe 1250,00", "TOTAL 1250,00"]):
              draw.text((40, 60 + i * 90), line, fill="black")
          img.save("/tmp/recibo.png")
          PY
          curl -sf -F "file=@/tmp/recibo.png" "localhost:8000/extract?engine=tesseract" -o out.json
          python - <<'PY'
          import json, sys
          data = json.load(open("out.json"))
          assert data["engine"] == "tesseract", data
          assert data["receipt"] is not None, data
          assert data["words"], "no se detecto ninguna palabra"
          print("OK:", json.dumps(data["receipt"], indent=2))
          PY

      - if: always()
        run: docker compose down -v
